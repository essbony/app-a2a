stages:
  - lint
  - test
  - build
  - build_img
  - push_img

# ============================================================
# CONFIGURATION GLOBALE
# ============================================================

variables:
  DOCKER_IMAGE_NAME: "essbony/client-a2a-outline"

  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: "copy"

  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

# ============================================================
# CONFIGURATION PAR DÉFAUT DES JOBS PYTHON
# ============================================================

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

  before_script:
    - uv sync --locked --dev

  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
    policy: pull-push

# ============================================================
# 1. LINT : VÉRIFICATION STATIQUE DU CODE
# ============================================================

lint:
  stage: lint

  script:
    - echo "Vérification du code Python avec Ruff..."
    - uv run ruff check .

# ============================================================
# 2. TEST : EXÉCUTION DES TESTS AUTOMATISÉS
# ============================================================

test:
  stage: test

  script:
    - echo "Exécution des tests automatisés..."
    - uv run pytest -v

# ============================================================
# 3. BUILD : CONSTRUCTION DU PACKAGE PYTHON
# ============================================================

build:
  stage: build

  script:
    - echo "Construction du package Python..."
    - uv build

  artifacts:
    paths:
      - dist/
    expire_in: 1 week

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ============================================================
# 4. BUILD_IMG : CONSTRUCTION DE L'IMAGE DOCKER
# ============================================================

build_image:
  stage: build_img
  image: docker:cli
  inherit:
    default: false
  services:
    - name: docker:dind
      alias: docker

  image: docker:cli

  services:
    - name: docker:dind
      alias: docker

  script:
    - echo "Vérification de la connexion au démon Docker..."
    - docker info

    - echo "Construction de l'image Docker..."
    - docker build -t "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHA" .

    - echo "Création du tag latest..."
    - docker tag "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHA" "$DOCKER_IMAGE_NAME:latest"

    - echo "Sauvegarde des images Docker..."
    - docker save "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHA" "$DOCKER_IMAGE_NAME:latest" -o image.tar

    - echo "Image Docker construite avec succès."

  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ============================================================
# 5. PUSH_IMG : PUBLICATION SUR DOCKER HUB
# ============================================================


push_img:
  stage: push_img
  image: docker:cli
  inherit:
    default: false
  services:
    - name: docker:dind
      alias: docker
  needs:
    - job: build_image
      artifacts: true

  image: docker:cli

  services:
    - name: docker:dind
      alias: docker

  needs:
    - job: build_image
      artifacts: true

  script:
    - echo "Chargement de l'image Docker..."
    - docker load -i image.tar

    - echo "Connexion à Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - echo "Publication de l'image versionnée..."
    - docker push "$DOCKER_IMAGE_NAME:$CI_COMMIT_SHA"

    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Publication du tag latest..."
        docker push "$DOCKER_IMAGE_NAME:latest"
      fi

    - echo "Déconnexion de Docker Hub..."
    - docker logout

    - echo "Publication terminée."

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
