name: Client A2A - CI/CD

# ============================================================
# DÉCLENCHEURS
# ============================================================

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# VARIABLES GLOBALES
# ============================================================

env:
  DOCKER_IMAGE_NAME: essbony/client-a2a-outline
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read

# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # 1. LINT : ANALYSE STATIQUE
  # ==========================================================

  lint:
    name: Python - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check .


  # ==========================================================
  # 2. TEST : TESTS AUTOMATISÉS
  # ==========================================================

  test:
    name: Python - Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -v


  # ==========================================================
  # 3. BUILD : PACKAGE PYTHON
  # ==========================================================

  build:
    name: Build Python Package
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build Python package
        run: uv build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: dist/
          retention-days: 7


  # ==========================================================
  # 4. BUILD_IMG : CONSTRUCTION DE L'IMAGE DOCKER
  # ==========================================================

  build_image:
    name: Docker - Build Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - build

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" \
            .

      - name: Create latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" \
            "${{ env.DOCKER_IMAGE_NAME }}:latest"

      - name: Save Docker image
        run: |
          docker save \
            "${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" \
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.DOCKER_IMAGE_NAME) || '' }} \
            -o image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: image.tar
          retention-days: 1


  # ==========================================================
  # 5. PUSH_IMG : PUBLICATION SUR DOCKER HUB
  # ==========================================================

  push_image:
    name: Docker - Push to Docker Hub
    runs-on: ubuntu-latest

    needs:
      - build_image

    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v7
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push versioned image
        run: |
          docker push "${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"

      - name: Push latest image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${{ env.DOCKER_IMAGE_NAME }}:latest"

      - name: Logout from Docker Hub
        if: always()
        run: docker logout